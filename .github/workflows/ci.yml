name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The build tooling (tsdown) needs Node >= 22.18, so build and lint once on a current Node...
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # ...then run the tests and load the built package on every Node the package supports (>= 22.13).
  compat:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.13', '22', '24']
        include:
          - { os: windows-latest, node: '22' }
          - { os: macos-latest, node: '22' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Smoke test the built package (CJS and ESM)
        shell: bash
        run: |
          node -e "const s=require('./dist/index.cjs'); s.createStore(s.openDatabase(':memory:')); if(typeof s.createBrain!=='function') process.exit(1)"
          node --input-type=module -e "import * as s from './dist/index.mjs'; s.createStore(s.openDatabase(':memory:')); if(typeof s.createBrain!=='function') process.exit(1)"
